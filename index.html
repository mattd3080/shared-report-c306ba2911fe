<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; img-src data: blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Shared report</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f8f5;color:#18332b;font:16px/1.5 system-ui,sans-serif}
    #gate{max-width:560px;margin:16vh auto;padding:32px}h1{font:36px/1.2 Georgia,serif}p{color:#52665e}
    header{height:66px;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:1px solid #d5e0da;gap:16px}
    a{color:#17634e;font-weight:600}#report{display:block;width:100%;height:calc(100dvh - 66px);overflow:auto;background:white}
    [hidden]{display:none!important}@media(max-width:600px){header{padding:12px;font-size:14px}}
  </style>
  <script type="module" src="./viewer.js?v=2c19f3c6cf9dc7b1"></script>
</head>
<body>
  <section id="gate"><h1>Shared report</h1><p id="status" role="status">Open the complete shared link to view this report.</p></section>
  <main id="unlocked" hidden>
    <header><strong>Strategic investor report</strong><a id="download" download="strategic-investor-report.pdf">Download PDF</a></header>
    <div id="report" aria-label="Strategic investor report"></div>
  </main>
</body>
</html>
